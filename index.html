<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Contribution Tracker</title>

    <!-- Supabase JS CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>Group Contribution Tracker</h1>

    <div class="card">
        <h2>Add Contribution</h2>

        <label for="person">Person</label>
        <select id="person">
            <option>Amy</option>
            <option>Hannah</option>
            <option>Sabrina</option>
            <option>Vanessa</option>
        </select>

        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" step="0.5">

        <label for="description">What did you do?</label>
        <textarea id="description"
            placeholder="Describe what you worked on..."></textarea>

        <button onclick="addContribution()">
            Add Contribution
        </button>
    </div>

    <div class="card">
        <h2>Contributions</h2>

        <table>
            <thead>
                <tr>
                    <th>Person</th>
                    <th>Hours</th>
                    <th>What they did</th>
                </tr>
            </thead>

            <tbody id="contributionTable">
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwvitqpybgcnmxbobyyd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lDsA_0I27CFGAe26sI1GHA_kzoOjAkU';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch existing contributions when the page loads
        async function fetchContributions() {
            const { data, error } = await supabaseClient
                .from('contributions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching contributions:", error);
                return;
            }

            const table = document.getElementById("contributionTable");
            table.innerHTML = ""; // Clear existing rows

            data.forEach(item => {
                const row = table.insertRow();
                row.insertCell(0).textContent = item.person;
                row.insertCell(1).textContent = item.hours;
                row.insertCell(2).textContent = item.description;
            });
        }

        // Add a new contribution to Supabase
        async function addContribution() {
            const person = document.getElementById("person").value;
            const hours = document.getElementById("hours").value;
            const description = document.getElementById("description").value;

            if (!hours || !description) {
                alert("Please enter hours and a description.");
                return;
            }

            const { data, error } = await supabaseClient
                .from('contributions')
                .insert([
                    { person: person, hours: parseFloat(hours), description: description }
                ]);

            if (error) {
                console.error("Error adding contribution:", error);
                alert("Failed to submit contribution. Make sure RLS permissions are set up.");
            } else {
                document.getElementById("hours").value = "";
                document.getElementById("description").value = "";
                fetchContributions(); // Refresh the table
            }
        }

        // Run fetch on initial page load
        fetchContributions();
    </script>

</body>
</html>
