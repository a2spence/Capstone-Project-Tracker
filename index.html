<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Contribution Tracker</title>

    <!-- Supabase JS CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .people-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-top: 5px;
        }

        .people-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 0;
            font-weight: normal;
        }

        .people-options input {
            width: auto;
            margin: 0;
        }

        .attachments a {
            display: block;
            margin-bottom: 4px;
        }

        .attachments img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>Group Contribution Tracker</h1>

    <div class="card">
        <h2>Add Contribution</h2>

        <label>People</label>
        <div class="people-options" id="people">
            <label><input type="checkbox" value="Amy"> Amy</label>
            <label><input type="checkbox" value="Hannah"> Hannah</label>
            <label><input type="checkbox" value="Sabrina"> Sabrina</label>
            <label><input type="checkbox" value="Vanessa"> Vanessa</label>
        </div>

        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" step="0.5">

        <label for="description">What did you do?</label>
        <textarea id="description"
            placeholder="Describe what you worked on..."></textarea>

        <label for="files">Attachments (optional)</label>
        <input type="file" id="files" multiple
            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png">

        <button onclick="addContribution()">
            Add Contribution
        </button>
    </div>

    <div class="card">
        <h2>Contributions</h2>

        <table>
            <thead>
                <tr>
                    <th>Person</th>
                    <th>Hours</th>
                    <th>What they did</th>
                    <th>Attachments</th>
                </tr>
            </thead>

            <tbody id="contributionTable">
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwvitqpybgcnmxbobyyd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lDsA_0I27CFGAe26sI1GHA_kzoOjAkU';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch existing contributions when the page loads
        async function fetchContributions() {
            const { data, error } = await supabaseClient
                .from('contributions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching contributions:", error);
                return;
            }

            const table = document.getElementById("contributionTable");
            table.innerHTML = ""; // Clear existing rows

            data.forEach(item => {
                const row = table.insertRow();
                row.insertCell(0).textContent = item.person;
                row.insertCell(1).textContent = item.hours;
                row.insertCell(2).textContent = item.description;

                const attachCell = row.insertCell(3);
                attachCell.className = "attachments";
                (item.attachments || []).forEach(file => {
                    const link = document.createElement("a");
                    link.href = file.url;
                    link.target = "_blank";
                    link.rel = "noopener";
                    if (/\.(jpe?g|png)$/i.test(file.name)) {
                        const img = document.createElement("img");
                        img.src = file.url;
                        img.alt = file.name;
                        link.appendChild(img);
                    } else {
                        link.textContent = file.name;
                    }
                    attachCell.appendChild(link);
                });
            });
        }

        // Upload files to the "attachments" storage bucket and return their names + public URLs
        async function uploadFiles(files) {
            const uploaded = [];
            for (const file of files) {
                const safeName = file.name.replace(/[^\w.\-]/g, "_");
                const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeName}`;

                const { error } = await supabaseClient.storage
                    .from('attachments')
                    .upload(path, file);

                if (error) throw error;

                const { data } = supabaseClient.storage.from('attachments').getPublicUrl(path);
                uploaded.push({ name: file.name, url: data.publicUrl });
            }
            return uploaded;
        }

        const TEAM_PASSCODE = "password";

        async function addContribution() {
            const people = [...document.querySelectorAll("#people input:checked")].map(cb => cb.value);
            const hours = document.getElementById("hours").value;
            const description = document.getElementById("description").value;
            const files = document.getElementById("files").files;

            if (people.length === 0) {
                alert("Please select at least one person.");
                return;
            }

            if (!hours || !description) {
                alert("Please enter hours and a description.");
                return;
            }

            const userCode = prompt("Enter the team passcode to submit a contribution:");
            if (userCode !== TEAM_PASSCODE) {
                alert("Incorrect passcode! You do not have permission to post.");
                return;
            }

            let attachments = [];
            try {
                attachments = await uploadFiles(files);
            } catch (uploadError) {
                console.error("Error uploading files:", uploadError);
                alert("Failed to upload attachments. Check the storage bucket settings.");
                return;
            }

            const { data, error } = await supabaseClient
                .from('contributions')
                .insert([
                    {
                        person: people.join(", "),
                        hours: parseFloat(hours),
                        description: description,
                        attachments: attachments
                    }
                ]);

            if (error) {
                console.error("Error adding contribution:", error);
                alert("Failed to submit contribution. Check RLS settings.");
            } else {
                document.querySelectorAll("#people input").forEach(cb => cb.checked = false);
                document.getElementById("hours").value = "";
                document.getElementById("description").value = "";
                document.getElementById("files").value = "";
                fetchContributions(); // Refresh the table list
            }
        }

        // Run fetch on initial page load
        fetchContributions();
    </script>

</body>
</html>
