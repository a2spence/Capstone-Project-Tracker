<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Contribution Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>Group Contribution Tracker</h1>

    <div class="card">
        <h2>Add Contribution</h2>

        <label for="person">Person</label>
        <select id="person">
            <option>Amy</option>
            <option>Person 2</option>
            <option>Person 3</option>
            <option>Person 4</option>
        </select>

        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" step="0.5">

        <label for="description">What did you do?</label>
        <textarea id="description"
            placeholder="Describe what you worked on..."></textarea>

        <button onclick="addContribution()">
            Add Contribution
        </button>
    </div>

    <div class="card">
        <h2>Contributions</h2>

        <table>
            <thead>
                <tr>
                    <th>Person</th>
                    <th>Hours</th>
                    <th>What they did</th>
                </tr>
            </thead>

            <tbody id="contributionTable">
            </tbody>
        </table>
    </div>

    <script>

        function addContribution() {

            const person = document.getElementById("person").value;
            const hours = document.getElementById("hours").value;
            const description =
                document.getElementById("description").value;

            if (!hours || !description) {
                alert("Please enter hours and a description.");
                return;
            }

            const table =
                document.getElementById("contributionTable");

            const row = table.insertRow();

            row.insertCell(0).textContent = person;
            row.insertCell(1).textContent = hours;
            row.insertCell(2).textContent = description;

            document.getElementById("hours").value = "";
            document.getElementById("description").value = "";
        }

    </script>

</body>
</html>
